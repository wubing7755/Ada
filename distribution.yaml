name: ada
version: 0.5.0
description: A pragmatic software-engineering Hermes profile focused on correctness,
  clarity, and verifiable results. Includes 12 Agent Skills-compatible capabilities
  covering agent-assisted workflows, systematic debugging, TDD,
  code review, code quality analysis, simplification, engineering refactoring,
  Git/PR delivery, research and planning, and Windows environment tooling.
  Requires Hermes >=0.19.0 for built-in skills
  (autonomous AI agents, GitHub workflows, plan, spike).
hermes_requires: '>=0.19.0'
author: wubing7755
license: MIT
source: github.com/wubing7755/Ada
