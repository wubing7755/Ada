name: ada
version: 0.2.0
description: A pragmatic software-engineering Hermes profile focused on correctness,
  clarity, and verifiable results. Includes 44 curated skills spanning SRS lifecycle,
  code quality, .NET/Blazor engineering, CMake/CPack packaging, systematic debugging,
  document processing, research and planning, and autonomous agent workflows.
  Requires Hermes >=0.19.0 for built-in skills
  (autonomous AI agents, GitHub workflows, plan, spike).
