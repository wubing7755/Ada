name: ada
version: 0.4.0
description: A pragmatic software-engineering Hermes profile focused on correctness,
  clarity, and verifiable results. Includes 77 Agent Skills-compatible capabilities
  spanning SRS lifecycle, code quality, public API and stateful-service audits,
  .NET/Blazor engineering, UI interaction contracts, CMake/CPack packaging,
  systematic debugging, business document delivery, research and planning,
  and autonomous phased workflows.
  Requires Hermes >=0.19.0 for built-in skills
  (autonomous AI agents, GitHub workflows, plan, spike).
hermes_requires: '>=0.19.0'
author: wubing7755
license: MIT
source: github.com/wubing7755/Ada
